[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = .venv,venv,build,dist,__pycache__,.git,docs/archive,tests/manual
# app/ui_dashboard.py and app/main.py carry pre-existing long-line, unused-var,
# and sys.path-before-import debt tracked in PRODUCTION_READINESS.md (Phase 3
# UI decomposition). Scoped here instead of a blanket ignore so new code
# elsewhere stays fully linted.
per-file-ignores =
    app/ui_dashboard.py:E501,E402,F841,F401
    app/main.py:E402
    app/tabs/data_overview_tab.py:E501,F841
    app/tabs/explainability_tab.py:E501,F841
    app/tabs/models_tab.py:E501
    app/tabs/pca_analysis_tab.py:F841
    app/tabs/professional_automl_tab.py:E501
    app/tabs/recommendation_tab.py:E501
    app/tabs/report_tab.py:E501,F841
    core/models_clustering.py:F401,E722
    # Long lines below are natural-language content (LLM prompts, log/error
    # messages) where hand-wrapping doesn't improve readability and risks
    # introducing whitespace bugs in prompt text; not a real formatting gap.
    core/ai_insights.py:E501
    core/ai_insights_enhanced.py:E501
    core/overfitting_detector.py:E501
    core/preprocess.py:E501
    core/meta_selector.py:E501
    core/dimred_evaluator.py:E501
    core/evaluate_cls.py:E501
    utils/cloud_executor.py:E501
    utils/jupyter_client.py:E501
